---
- name: Provision dedicated live Appwrite ingress LXC
  hosts: lxc_live_nginx
  become: true
  gather_facts: false
  vars_files:
    - vars/versions.yaml
  vars:
    cloudflared_tunnel_token: "{{ lookup('env', 'CLOUDFLARED_TUNNEL_TOKEN') }}"

  pre_tasks:
    - name: Require the Cloudflare Tunnel token
      ansible.builtin.assert:
        that:
          - cloudflared_tunnel_token | length > 0
        fail_msg: "Set CLOUDFLARED_TUNNEL_TOKEN before provisioning live-nginx."
      tags: [cloudflared_setup]

    - name: Download Nginx signing key
      ansible.builtin.get_url:
        url: https://nginx.org/keys/nginx_signing.key
        dest: /usr/share/keyrings/nginx-signing.asc
        owner: root
        group: root
        mode: '0644'

    - name: Add official nginx.org apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/nginx-signing.asc] https://nginx.org/packages/debian bookworm nginx"
        filename: nginx
        state: present

  tasks:
    - name: Ensure base packages
      ansible.builtin.apt:
        cache_valid_time: 3600
        pkg:
          - curl
          - wget
          - tar
          - ca-certificates

    - name: Ensure Nginx is installed at the requested version
      ansible.builtin.apt:
        update_cache: true
        name: "nginx={{ nginx_package_version }}"

    - name: Download cloudflared Debian package
      ansible.builtin.get_url:
        url: "https://github.com/cloudflare/cloudflared/releases/download/{{ cloudflared_version }}/cloudflared-linux-amd64.deb"
        dest: "/tmp/cloudflared-{{ cloudflared_version }}-linux-amd64.deb"
        checksum: "sha256:{{ cloudflared_linux_amd64_deb_sha256 }}"
        mode: '0644'
      tags: [cloudflared_setup]

    - name: Install cloudflared
      ansible.builtin.apt:
        deb: "/tmp/cloudflared-{{ cloudflared_version }}-linux-amd64.deb"
      tags: [cloudflared_setup]

    - name: Ensure cloudflared user exists
      ansible.builtin.user:
        name: cloudflared
        shell: /usr/sbin/nologin
        system: true
        state: present
      tags: [cloudflared_setup]

    - name: Ensure cloudflared directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
          - { path: /etc/cloudflared, owner: root, group: cloudflared, mode: '0750' }
          - { path: /var/log/cloudflared, owner: cloudflared, group: cloudflared, mode: '0750' }
      tags: [cloudflared_setup]

    - name: Write cloudflared tunnel environment
      ansible.builtin.copy:
        dest: /etc/default/cloudflared
        content: "TUNNEL_TOKEN={{ cloudflared_tunnel_token }}\n"
        owner: root
        group: cloudflared
        mode: '0640'
      no_log: true
      tags: [cloudflared_setup]

    - name: Install cloudflared systemd unit
      ansible.builtin.template:
        src: templates/cloudflared.service.j2
        dest: /etc/systemd/system/cloudflared.service
        owner: root
        group: root
        mode: '0644'
      tags: [cloudflared_setup]

    - name: Enable and start cloudflared
      ansible.builtin.systemd:
        daemon_reload: true
        name: cloudflared
        state: started
        enabled: true
      tags: [cloudflared_setup]

    - name: Remove the package default Nginx server
      ansible.builtin.file:
        path: /etc/nginx/conf.d/default.conf
        state: absent

    - name: Deploy dedicated live Nginx configuration
      block:
        - name: Deploy live Nginx conf.d
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../nginx-live/conf.d/"
            dest: /etc/nginx/conf.d/
            owner: root
            group: root
            mode: '0644'
            directory_mode: '0755'

        - name: Deploy live Nginx main configuration
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../nginx-live/nginx.conf"
            dest: /etc/nginx/nginx.conf
            owner: root
            group: root
            mode: '0644'

        - name: Validate live Nginx configuration
          ansible.builtin.command: nginx -t
          changed_when: false

        - name: Restart live Nginx
          ansible.builtin.systemd:
            name: nginx
            state: restarted
            enabled: true
      tags: [nginx_setup]

    - name: Install Nginx Prometheus exporter
      block:
        - name: Download Nginx Prometheus exporter
          ansible.builtin.get_url:
            url: "https://github.com/nginx/nginx-prometheus-exporter/releases/download/v{{ nginx_exporter_version }}/nginx-prometheus-exporter_{{ nginx_exporter_version }}_linux_amd64.tar.gz"
            dest: /tmp/nginx-prometheus-exporter.tar.gz
            checksum: "sha256:{{ nginx_exporter_linux_amd64_sha256 }}"
            mode: '0644'

        - name: Unarchive Nginx Prometheus exporter
          ansible.builtin.unarchive:
            src: /tmp/nginx-prometheus-exporter.tar.gz
            dest: /tmp
            remote_src: true

        - name: Install exporter binary
          ansible.builtin.copy:
            src: /tmp/nginx-prometheus-exporter
            dest: /usr/local/bin/nginx-prometheus-exporter
            owner: root
            group: root
            mode: '0755'
            remote_src: true

        - name: Ensure exporter user exists
          ansible.builtin.user:
            name: nginx-prometheus-exporter
            shell: /usr/sbin/nologin
            system: true
            state: present

        - name: Install exporter systemd unit
          ansible.builtin.template:
            src: templates/nginx-prometheus-exporter.service.j2
            dest: /etc/systemd/system/nginx-prometheus-exporter.service
            owner: root
            group: root
            mode: '0644'

        - name: Enable and start exporter
          ansible.builtin.systemd:
            daemon_reload: true
            name: nginx-prometheus-exporter
            state: started
            enabled: true
      tags: [nginx_exporter_setup]
