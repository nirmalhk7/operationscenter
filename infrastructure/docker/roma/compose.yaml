services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1
    restart: unless-stopped
    network_mode: host
    pid: host
    uts: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=10.0.0.79:9100
    volumes:
      - /:/host:ro,rslave
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
