apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app appwrite
  namespace: live-devbench
spec:
  releaseName: *app
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: appwrite
      version: 1.2.2
      sourceRef:
        kind: HelmRepository
        name: appwrite-helm
        namespace: live-devbench
  postRenderers:
    - kustomize:
        patches:
          # Chart 1.2.2 puts this PHP option after app/worker.php, where
          # Appwrite interprets it as the queue name instead of a PHP option.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: appwrite-worker-.*
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/command
                value:
                  - php
                  - -e
                  - -dopcache.preload=opcache.preload
                  - app/worker.php
  values:
    commonLabels:
      milano.app: appwrite
    appwrite:
      domain: dev.nirmalhk7.com
      existingSecret: appwrite-env
      existingSecretOpenSslKey: _APP_OPENSSL_KEY_V1
      # Disable Appwrite's internal usage dashboard and its aggregation work.
      usageStats: disabled
      storage:
        limit: "30000000"
      extraEnv:
        # The Appwrite default is six API/realtime workers per available core.
        # This node is CPU-constrained, so keep a smaller process pool.
        - name: _APP_WORKER_PER_CORE
          value: "2"
        - name: _APP_OPTIONS_FORCE_HTTPS
          value: enabled
        - name: _APP_OPTIONS_ROUTER_FORCE_HTTPS
          value: enabled
        - name: _APP_OPTIONS_ABUSE
          value: enabled
        - name: _APP_SMTP_HOST
          # Appwrite's musl resolver requires an absolute FQDN in this cluster.
          value: smtp.maileroo.com.
        - name: _APP_SMTP_PORT
          value: "587"
        - name: _APP_SMTP_SECURE
          value: tls
        - name: _APP_SMTP_USERNAME
          value: nestor@nirmalhk7.com
        - name: _APP_SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: appwrite-env
              key: _APP_SMTP_PASSWORD
        - name: _APP_SYSTEM_EMAIL_ADDRESS
          value: nestor@nirmalhk7.com
        - name: _APP_SYSTEM_EMAIL_NAME
          value: "Nirmal - Appwrite"
        - name: _APP_STORAGE_DEVICE
          value: Local
    api:
      podAnnotations:
        milano.app: appwrite
    realtime:
      podAnnotations:
        milano.app: appwrite
    workers:
      audits:
        enabled: true
      mails:
        enabled: true
      builds:
        enabled: false
      certificates:
        enabled: true
      functions:
        enabled: false
      statsResources:
        enabled: false
      statsUsage:
        enabled: false
    schedulers:
      executions:
        enabled: true
      functions:
        enabled: false
      messages:
        enabled: true
    tasks:
      statsResources:
        enabled: false
    persistence:
      enabled: true
      # Existing Appwrite PVCs are bound to milano-v3; storageClass is
      # immutable after binding and must not be changed in-place.
      storageClass: milano-v3
      uploads:
        size: 10Gi
      cache:
        size: 2Gi
      certificates:
        size: 1Gi
      functions:
        size: 5Gi
      builds:
        size: 5Gi
      sites:
        size: 5Gi
    mariadb:
      enabled: false
    database:
      adapter: mariadb
      mode: external
      external:
        host: 172.16.0.106
        port: 3306
        rootUser: appwrite_rw
        name: appwrite
        existingSecret: appwrite-env
        existingSecretPasswordKey: _APP_DB_PASS
    redis:
      enabled: true
      image:
        repository: docker.io/library/redis
        tag: "8.8.0"
      metrics:
        enabled: false
      auth:
        # Appwrite 1.9.0's queue adapter does not authenticate its Redis
        # connections. Disable requirepass to prevent an unauthenticated
        # BRPOP retry loop while this instance has no users.
        enabled: false
      standalone:
        persistence:
          enabled: true
          storageClass: milano-v2
          size: 8Gi
