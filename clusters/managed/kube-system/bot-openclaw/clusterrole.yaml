apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rahul-cluster-observer-role
rules:
  # Read-only operational evidence. Secrets are intentionally absent.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - endpoints
      - replicationcontrollers
      - persistentvolumeclaims
      - persistentvolumes
      - nodes
      - namespaces
      - events
      - serviceaccounts
      - resourcequotas
    verbs: ["get", "list", "watch"]

  - apiGroups:
      - apps
      - networking.k8s.io
      - batch
      - autoscaling
      - policy
      - discovery.k8s.io
      - metrics.k8s.io
      - traefik.io
      - monitoring.coreos.com
      - rbac.authorization.k8s.io
      - storage.k8s.io
      - apiextensions.k8s.io
      - admissionregistration.k8s.io
      - scheduling.k8s.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
