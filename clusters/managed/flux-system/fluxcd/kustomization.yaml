apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml

# Keep generated Flux manifests intact. GitHub SSH port 22 is blocked from
# this cluster, so route the existing deploy-key source through GitHub's SSH
# service on TCP 443.
patches:
  - target:
      group: source.toolkit.fluxcd.io
      version: v1
      kind: GitRepository
      name: operationscenter-git
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/url
        value: ssh://git@ssh.github.com:443/nirmalhk7/operationscenter.git
